[package]
name = "clipquest"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "clipquest"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = true }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.18"

[profile.release]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
