<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15171d">
  <!-- The deploy replaces dev-build with the release version, so browsers fetch fresh files. -->
  <meta name="clipquest-version" content="dev-build">
  <title>ClipQuest — interactive video</title>
  <link rel="stylesheet" href="style.css?v=dev-build">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="menu-btn" aria-label="Menu" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="brand">ClipQuest</div>
    <div class="lesson-title" id="lesson-title"></div>
    <nav class="tabs" id="tabs-top" aria-label="Sections"></nav>
  </header>

  <main id="main"></main>

  <nav class="bottom-nav" id="tabs-bottom" aria-label="Sections"></nav>

  <div class="sheet-backdrop" id="menu-backdrop" hidden></div>
  <aside class="menu-sheet" id="menu" role="dialog" aria-label="Menu" hidden></aside>

  <input type="file" id="open-file" accept=".json,application/json" hidden>
  <input type="file" id="video-file" accept="video/*" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="examples.js?v=dev-build"></script>
  <script src="app.js?v=dev-build"></script>
</body>
</html>
